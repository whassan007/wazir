services:
  # Wazir Control Plane / Controller Service
  wazir-api:
    image: ghcr.io/whassan007/wazir:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wazir-controller
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - WAZIR_HOST=0.0.0.0
    volumes:
      - wazir-controller-data:/home/wazir/.wazir
    healthcheck:
      test: ["CMD", "wa", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - wazir-net

  # Wazir Compute Fleet Worker Node
  wazir-worker:
    image: ghcr.io/whassan007/wazir:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wazir-worker-01
    restart: unless-stopped
    depends_on:
      wazir-api:
        condition: service_healthy
    command: ["worker", "--api-url", "http://wazir-api:3000"]
    environment:
      - NODE_ENV=production
      - WAZIR_SERVER_URL=http://wazir-api:3000
      - WAZIR_COMPUTER_ID=worker-docker-01
      - WAZIR_COMPUTER_NAME=worker-docker-01
    volumes:
      - wazir-worker-data:/home/wazir/.wazir
    networks:
      - wazir-net
    # DGX Spark / NVIDIA GPU Acceleration (uncomment if GPU compute node available)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

networks:
  wazir-net:
    driver: bridge

volumes:
  wazir-controller-data:
    driver: local
  wazir-worker-data:
    driver: local

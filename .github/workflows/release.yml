name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (optional when triggered via push)'
        required: false
      publish_draft:
        description: 'Create draft release on GitHub'
        type: boolean
        default: true
      publish_npm:
        description: 'Publish npm package to registry'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Quality Gates
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
      - name: Verify tag and version
        id: meta
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="$(node -p "require('./package.json').version")"
          [ "$tag" = "v$version" ] || { echo "::error::tag $tag does not match package.json version $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run check-dist -- --quiet
      - run: npm run package:check -- --skip-build
      - run: npm run release:verify
      - run: npm test

  verify-cross-platform:
    name: Verify Cross-Platform Tests (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
      - run: npm ci
      - name: Ensure node-pty helper is executable on macOS
        if: runner.os == 'macOS'
        run: find node_modules/node-pty -name "spawn-helper" -exec chmod +x {} + || true
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

  build-artifacts:
    name: Build Artifacts (${{ matrix.target }})
    needs: [verify, verify-cross-platform]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-latest
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
          - os: windows-latest
            target: windows-x64
          - os: windows-11-arm
            target: windows-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
      - run: npm ci
      - name: Ensure node-pty helper is executable on macOS
        if: runner.os == 'macOS'
        run: |
          helpers="$(find node_modules/node-pty -name 'spawn-helper')"
          if [ -z "$helpers" ]; then
            echo "ERROR: no node-pty spawn-helper binary found under node_modules/node-pty" >&2
            exit 1
          fi
          find node_modules/node-pty -name "spawn-helper" -exec chmod +x {} +
      - run: npm run build
      - name: Generate release archives
        run: node scripts/package-release-artifacts.mjs
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error

  publish:
    name: Create Release & Publish
    needs: [verify, verify-cross-platform, build-artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Consolidate artifacts and generate unified SHA256SUMS
        run: |
          mkdir -p release-dist
          find all-artifacts -type f ! -name "*.sha256" ! -name "SHA256SUMS.txt" -exec cp {} release-dist/ \;
          cd release-dist
          sha256sum * > SHA256SUMS.txt
          echo "=== Release Artifacts & Checksums ==="
          cat SHA256SUMS.txt

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-dist/wazir-*

      - name: Create GitHub Release (Draft)
        if: github.event_name == 'push' || inputs.publish_draft == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          draft: true
          prerelease: false
          files: release-dist/*
          generate_release_notes: true
          name: Wazir ${{ needs.verify.outputs.tag }}

      - name: Publish to npm registry (Requires explicit authorization)
        if: inputs.publish_npm == true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          TGZ=$(find release-dist -name "wazir-*.tgz" | head -n 1)
          if [ -n "$TGZ" ]; then
            echo "Publishing $TGZ to npm..."
            npm publish "$TGZ" --access public
          else
            echo "Error: No npm tarball found in release-dist"
            exit 1
          fi


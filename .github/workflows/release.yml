name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (optional when triggered via push)'
        required: false
      publish_draft:
        description: 'Create draft release on GitHub (manual staging only)'
        type: boolean
        default: false
      publish_npm:
        description: 'Publish npm package to registry'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Quality Gates
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      commit_sha: ${{ steps.meta.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - name: Verify tag and version
        id: meta
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="$(node -p "require('./package.json').version")"
          commit_sha="$(git rev-parse HEAD)"
          [ "$tag" = "v$version" ] || { echo "::error::tag $tag does not match package.json version $version"; exit 1; }
          node scripts/release-integrity.mjs --version "$version" --tag "$tag" --commit "$commit_sha"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - name: Verify lockfile and workspace resolution
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Rebuild native dependencies
        run: npm rebuild node-pty
      - run: npm run build
      - run: npm run typecheck
      - run: npm run check-dist -- --quiet
      - run: npm run package:check -- --skip-build
      - run: npm run release:verify
      - run: npm test
      - run: npm run release:gate
      - name: Release integrity unit tests
        run: node --test tests/release/release-integrity.test.mjs
      - name: API startup and health smoke
        run: node scripts/api-health-smoke.mjs

  verify-cross-platform:
    name: Verify Cross-Platform Tests (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.commit_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
      - name: Install Linux desktop build dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - run: npm ci
      - name: Ensure node-pty helper is executable on macOS
        if: runner.os == 'macOS'
        run: find node_modules/node-pty -name "spawn-helper" -exec chmod +x {} + || true
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run release:gate
      - name: Release integrity unit tests
        run: node --test tests/release/release-integrity.test.mjs

  build-artifacts:
    name: Build Artifacts (${{ matrix.target }})
    needs: [verify, verify-cross-platform]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-latest
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
          - os: windows-latest
            target: windows-x64
          - os: windows-11-arm
            target: windows-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.commit_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
      - name: Install Linux desktop build dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - run: npm ci
      - name: Verify lockfile and workspace resolution
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Rebuild native dependencies
        run: npm rebuild node-pty
      - name: Ensure node-pty helper is executable on macOS
        if: runner.os == 'macOS'
        run: |
          helpers="$(find node_modules/node-pty -name 'spawn-helper')"
          if [ -z "$helpers" ]; then
            echo "ERROR: no node-pty spawn-helper binary found under node_modules/node-pty" >&2
            exit 1
          fi
          find node_modules/node-pty -name "spawn-helper" -exec chmod +x {} +
      - run: npm run build
      - name: Generate release archives
        run: node scripts/package-release-artifacts.mjs
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error

  publish:
    name: Create Release & Publish
    needs: [verify, verify-cross-platform, build-artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.commit_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Consolidate artifacts and generate unified SHA256SUMS
        run: |
          mkdir -p release-dist
          files=$(find all-artifacts -type f ! -name "*.sha256" ! -name "SHA256SUMS.txt" -print)
          test -n "$files"
          printf '%s\n' "$files" | while IFS= read -r f; do
            dest="release-dist/$(basename "$f")"
            if [ -e "$dest" ]; then cmp -s "$f" "$dest" || { echo "conflicting duplicate artifact: $dest"; exit 1; }; else cp "$f" "$dest"; fi
          done
          cd release-dist
          sha256sum * > SHA256SUMS.txt
          node "$GITHUB_WORKSPACE/scripts/release-integrity.mjs" --version "${{ needs.verify.outputs.version }}" --tag "${{ needs.verify.outputs.tag }}" --artifacts "$GITHUB_WORKSPACE/release-dist"
          echo "=== Release Artifacts & Checksums ==="
          cat SHA256SUMS.txt

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-dist/wazir-*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          draft: false
          prerelease: ${{ contains(needs.verify.outputs.version, '-') }}
          make_latest: ${{ !contains(needs.verify.outputs.version, '-') }}
          files: release-dist/*
          generate_release_notes: true
          name: Wazir ${{ needs.verify.outputs.tag }}

      - name: Verify published release integrity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          extra_flags=()
          if [[ "${{ contains(needs.verify.outputs.version, '-') }}" != "true" ]]; then
            extra_flags+=(--stable --latest)
          fi
          node scripts/release-integrity.mjs \
            --version "${{ needs.verify.outputs.version }}" \
            --tag "${{ needs.verify.outputs.tag }}" \
            --commit "${{ needs.verify.outputs.commit_sha }}" \
            --artifacts release-dist \
            "${extra_flags[@]}"

      - name: Publish to npm registry (Requires explicit authorization)
        if: inputs.publish_npm == true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          TGZ=$(find release-dist -name "wazir-*.tgz" | head -n 1)
          if [ -n "$TGZ" ]; then
            echo "Publishing $TGZ to npm..."
            npm publish "$TGZ" --access public
          else
            echo "Error: No npm tarball found in release-dist"
            exit 1
          fi


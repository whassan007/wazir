name: Release

# Builds release artifacts for an existing, immutable version tag and creates a DRAFT GitHub
# release. Nothing is made public automatically:
#   - the GitHub release stays a draft until a maintainer publishes it;
#   - npm publishing is a separate, manually dispatched job behind the `npm-publish`
#     environment (configure required reviewers on it), using npm trusted publishing (OIDC).
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build (e.g. v0.1.60)
        required: true
      publish_npm:
        description: Publish the npm package after building (requires npm-publish environment approval)
        type: boolean
        default: false
      publish_images:
        description: Push OCI images to ghcr.io (requires ghcr-publish environment approval)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Verify tag, version and provenance
        id: meta
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="$(node -p "require('./package.json').version")"
          [ "$tag" = "v$version" ] || { echo "::error::tag $tag does not match package.json version $version"; exit 1; }
          git fetch --quiet origin main
          git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/main || { echo "::error::$tag is not on main"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - name: Package check
        run: npm run package:check -- --skip-build
      - name: Collect npm artifacts
        shell: bash
        run: |
          v="${{ steps.meta.outputs.version }}"
          mkdir -p release
          cp "dist/npm/wazir-$v.tgz" "release/wazir-$v.tgz"
          cp dist/package-check-linux-x64.json release/
          # SBOM of the published package's dependency tree (its optional native modules).
          (cd dist/npm/package && npm install --package-lock-only --ignore-scripts --no-audit --no-fund >/dev/null \
            && npm sbom --sbom-format cyclonedx --package-lock-only) > "release/wazir-$v.cdx.json"
      - uses: actions/upload-artifact@v4
        with:
          name: part-npm
          path: release/
          if-no-files-found: error

  windows:
    name: Windows executable
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build wa.exe and smoke-test it
        shell: pwsh
        run: |
          node scripts/build-sea.mjs --skip-bundle
          $v = "${{ needs.build.outputs.version }}"
          $env:WAZIR_HOME = Join-Path $env:RUNNER_TEMP 'h'
          if ((dist/sea/wa.exe --version).Trim() -ne $v) { throw 'version mismatch' }
          dist/sea/wa.exe resources validate --json | Out-Null
          New-Item -ItemType Directory release | Out-Null
          Copy-Item "dist/sea/wazir-$v-windows-x64.zip" release/
      - uses: actions/upload-artifact@v4
        with:
          name: part-windows
          path: release/
          if-no-files-found: error

  linux:
    name: Linux executable and deb/rpm (${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { arch: x64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build and test
        run: |
          node scripts/build-sea.mjs --skip-bundle
          node scripts/build-linux-packages.mjs
          mkdir -p release && cp dist/sea/*.tar.gz dist/linux/* release/
      - uses: actions/upload-artifact@v4
        with:
          name: part-linux-${{ matrix.arch }}
          path: release/
          if-no-files-found: error

  assemble:
    name: Checksums and provenance
    needs: [build, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # provenance attestations
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          merge-multiple: true
          path: release
      - name: SHA256SUMS
        run: |
          cd release && sha256sum wazir-* > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/wazir-*
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ needs.build.outputs.version }}
          path: release/
          if-no-files-found: error

  draft-release:
    name: Draft GitHub release
    needs: [build, assemble]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.build.outputs.version }}
          path: release
      - name: Create draft release (never overwrites an existing one)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ needs.build.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::release $tag already exists; artifacts are immutable, cut a new version instead"; exit 1
          fi
          awk -v v="## $tag" 'index($0, v)==1{f=1;next} /^## v/{f=0} f' CHANGELOG.md > notes.md
          gh release create "$tag" --draft --verify-tag --title "$tag" --notes-file notes.md release/*

  npm-publish:
    name: Publish to npm (manual, approved)
    needs: [build, draft-release]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish_npm == 'true'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write      # npm trusted publishing + provenance
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.build.outputs.version }}
          path: release
      - name: Verify checksum and that this version was never published
        shell: bash
        run: |
          v="${{ needs.build.outputs.version }}"
          (cd release && sha256sum -c SHA256SUMS --ignore-missing)
          if npm view "wazir@$v" version >/dev/null 2>&1; then echo "::error::wazir@$v is already on npm"; exit 1; fi
      - name: Publish
        run: npm publish "release/wazir-${{ needs.build.outputs.version }}.tgz" --provenance --access public

  ghcr-publish:
    name: Publish images to GHCR (manual, approved)
    needs: [build, draft-release]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish_images == 'true'
    runs-on: ubuntu-latest
    environment: ghcr-publish
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.tag }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Refuse to overwrite an existing version tag
        run: |
          if docker buildx imagetools inspect "ghcr.io/whassan007/wazir:${{ needs.build.outputs.version }}" >/dev/null 2>&1; then
            echo "::error::image tag already exists"; exit 1; fi
      - name: Build and push (cli as ghcr.io/whassan007/wazir; services as -api, -worker, -web)
        id: push
        run: |
          v="${{ needs.build.outputs.version }}"
          docker buildx build --platform linux/amd64,linux/arm64 --target cli --sbom=true --provenance=mode=max -t "ghcr.io/whassan007/wazir:$v" --push .
          for t in api worker web; do
            docker buildx build --platform linux/amd64,linux/arm64 --target "$t" --sbom=true --provenance=mode=max -t "ghcr.io/whassan007/wazir-$t:$v" --push .
          done


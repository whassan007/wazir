name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }} (Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22.x]
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Ensure node-pty helper is executable on macOS
        if: runner.os == 'macOS'
        run: find node_modules/node-pty -name "spawn-helper" -exec chmod +x {} + || true

      - name: Build packages and apps
        run: npm run build

      - name: Typecheck TypeScript code
        run: npm run typecheck

      # The CLI and API run from dist/; make sure what ships is what was built
      # from this commit (security review F-16).
      - name: Verify dist is fresh
        run: npm run check-dist -- --quiet

      - name: Validate distribution package metadata and exclusions
        run: npm run package:check

      - name: Run distribution package smoke test (isolated install & execution)
        run: npm run release:verify

      - name: Run unit and integration test suite
        run: npm test

      - name: Run Wazir acceptance test library (10 Release Gates G0..G9)
        run: npm run test:plan:acceptance

      - name: Run TUI regression test plan (50 cases)
        run: npm run test:plan:tui

      - name: Run agent execution test plan (55 cases)
        run: npm run test:plan:agent

      - name: Run Automated Release Validation Gate
        run: npm run release:gate

      # Platform Installation and CLI Smoke Test
      - name: Test Native Unix Installation (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          bash scripts/install.sh
          ~/.local/bin/wa --help
          ~/.local/bin/wa doctor || true

      - name: Test Native Windows Installation (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & .\scripts\install.ps1
          $binDir = if ($env:WAZIR_BIN_DIR) { $env:WAZIR_BIN_DIR } else { Join-Path $env:USERPROFILE ".wazir\bin" }
          & "$binDir\wa.cmd" --help
          & "$binDir\wa.cmd" doctor
          if ($LASTEXITCODE -ne 0) { Write-Host "wa doctor reported optional runtime warnings; the installation smoke test still passed." }
          $global:LASTEXITCODE = 0

      - name: Smoke test installed launcher from normal and Unicode paths (POSIX)
        if: runner.os != 'Windows'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          node scripts/smoke-test.mjs

      - name: Smoke test installed launcher from normal and Unicode paths (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binDir = if ($env:WAZIR_BIN_DIR) { $env:WAZIR_BIN_DIR } else { Join-Path $env:USERPROFILE ".wazir\bin" }
          $env:Path = "$binDir;$env:Path"
          node scripts\smoke-test.mjs

      # Standalone Native Single Executable Application (SEA) Packaging
      - name: Build Native Standalone Binary
        run: npm run build:binary

      - name: Verify Standalone Binary (Unix)
        if: runner.os != 'Windows'
        run: |
          ./dist/wa --help

      - name: Verify Standalone Binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & .\dist\wa.exe --help

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}-node-${{ matrix.node-version }}
          path: |
            acceptance-test-report.json
            test-plan-report.json
            agent-execution-test-plan-report.json
          if-no-files-found: ignore

  # The published npm package, installed and run the way users get it, on every OS, natively
  # (PowerShell/cmd on Windows, no WSL). Linux also runs the minimum supported Node exactly.
  package:
    name: Package (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 22.x }
          - { os: ubuntu-latest, node: 22.13.0 }
          - { os: macos-latest, node: 22.x }
          - { os: windows-latest, node: 22.x }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Ensure node-pty helper is executable on macOS
        if: runner.os == 'macOS'
        run: |
          helpers="$(find node_modules/node-pty -name 'spawn-helper')"
          if [ -z "$helpers" ]; then
            echo "ERROR: no node-pty spawn-helper binary found under node_modules/node-pty" >&2
            exit 1
          fi
          find node_modules/node-pty -name "spawn-helper" -exec chmod +x {} +
      - run: npm run build
      - run: npm run typecheck
      - name: Package check (pack, inspect, scan, install, smoke, upgrade, uninstall)
        run: npm run package:check -- --skip-build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-check-${{ matrix.os }}-${{ matrix.node }}
          path: dist/package-check-*.json
          if-no-files-found: ignore

  # Full unit, integration, and acceptance suite on macOS and Windows.
  tests-other-os:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Ensure node-pty helper is executable on macOS
        if: runner.os == 'macOS'
        run: |
          helpers="$(find node_modules/node-pty -name 'spawn-helper')"
          if [ -z "$helpers" ]; then
            echo "ERROR: no node-pty spawn-helper binary found under node_modules/node-pty" >&2
            exit 1
          fi
          find node_modules/node-pty -name "spawn-helper" -exec chmod +x {} +
      - run: npm run build
      - name: Unit and integration tests
        run: npx vitest run --reporter=default --reporter=json --outputFile=vitest-${{ matrix.os }}.json
      - name: Acceptance gates
        run: npm run test:plan:acceptance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.os }}
          path: |
            vitest-${{ matrix.os }}.json
            acceptance-test-report.json
          if-no-files-found: ignore


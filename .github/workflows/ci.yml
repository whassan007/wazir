name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build, Typecheck, and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Ensure native binary permissions on macOS
        if: runner.os == 'macOS'
        run: find node_modules/node-pty -name "spawn-helper" -exec chmod +x {} + || true

      - name: Build packages and apps
        run: npm run build

      - name: Typecheck TypeScript code
        run: npm run typecheck

      # The CLI and API run from dist/; make sure what ships is what was built
      # from this commit (security review F-16).
      - name: Verify dist is fresh
        run: npm run check-dist -- --quiet

      - name: Run unit and integration test suite
        run: npm test

      - name: Run Wazir acceptance test library
        run: npm run test:plan:acceptance

      - name: Run TUI regression test plan (50 cases)
        run: npm run test:plan:tui

      - name: Run agent execution test plan (55 cases)
        run: npm run test:plan:agent

      # Installation smoke tests (POSIX: Linux and macOS)
      - name: Run installer and CLI smoke tests (POSIX)
        if: runner.os != 'Windows'
        run: |
          bash scripts/install.sh
          export PATH="$HOME/.local/bin:$PATH"
          node scripts/smoke-test.mjs

      # Installation smoke tests (Windows: Native PowerShell)
      - name: Run installer and CLI smoke tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\install.ps1
          $env:Path = "$env:USERPROFILE\.wazir\bin;$env:Path"
          node scripts\smoke-test.mjs

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}-node-${{ matrix.node-version }}
          path: |
            acceptance-test-report.json
            test-plan-report.json
            agent-execution-test-plan-report.json
          if-no-files-found: ignore

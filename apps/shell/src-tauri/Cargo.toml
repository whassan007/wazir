[package]
name = "wazir-shell"
version = "0.4.0"
description = "Wazir Shell — Native Universal AI-Native Terminal"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"

[[bin]]
name = "wazir-shell"
path = "src/main.rs"
